services:
  database:
    image: pgvector/pgvector:pg17@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:version-17.5.0@sha256:936d39fc27ea5b7807d39bdc184b1033222a413dc185858817cbf51d2bbf96e4
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      PHOENIX_SQL_DATABASE_SCHEMA: phoenix
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: ${PHOENIX_DEFAULT_RETENTION_POLICY_DAYS:-30}
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
      PHOENIX_TELEMETRY_ENABLED: "false"
    ports:
      - "${PHOENIX_PORT:-6006}:6006"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:6006/', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    build: .
    command: ["core-agent-db", "migrate"]
    environment:
      DATABASE_MIGRATION_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      DATABASE_APP_ROLE: ${POSTGRES_USER}
      DATABASE_POOL_MIN: 0
      DATABASE_POOL_MAX: 1
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  agent:
    build: .
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./deploy/security/oci-${SANDBOX_OCI_ARCH:-amd64}.json
      - systempaths=unconfined
    devices:
      - /dev/net/tun:/dev/net/tun
    tmpfs:
      - /tmp:rw,exec,size=1g
    pids_limit: 512
    cpus: 2
    mem_limit: 4g
    environment:
      CORE_AGENT_ENVIRONMENT: ${CORE_AGENT_ENVIRONMENT:-development}
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_UI_CLIENT_ID: ${KEYCLOAK_UI_CLIENT_ID:-}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
      KEYCLOAK_OWNER_ROLE: ${KEYCLOAK_OWNER_ROLE:-agent-owner}
      KEYCLOAK_EXTERNAL_ROLE: ${KEYCLOAK_EXTERNAL_ROLE:-agent-external}
      CORE_AGENT_TENANT_ID: ${CORE_AGENT_TENANT_ID:-}
      PUSH_NOTIFICATION_ENCRYPTION_KEY: ${PUSH_NOTIFICATION_ENCRYPTION_KEY:-}
      AGENT_NAME: ${AGENT_NAME:-core-agent}
      AGENT_SYSTEM_PROMPT: ${AGENT_SYSTEM_PROMPT:-}
      SESSION_STORAGE_TYPE: postgres
      TASK_STORAGE_TYPE: ${TASK_STORAGE_TYPE:-postgres}
      SESSION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      DATABASE_AUTO_MIGRATE: "false"
      DATABASE_POOL_MIN: ${DATABASE_POOL_MIN:-1}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      LLM_API_FORMAT: ${LLM_API_FORMAT:-openai}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_BASE: ${LLM_API_BASE}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY}
      THINKING_LEVEL: ${THINKING_LEVEL:-}
      THINKING_ENABLED: ${THINKING_ENABLED:-true}
      AGENT_DESCRIPTION: ${AGENT_DESCRIPTION:-Policy-enforced core agent runtime}
      AGENT_VERSION: ${AGENT_VERSION:-1.0.0}
      A2A_CAPABILITIES: ${A2A_CAPABILITIES:-streaming,push_notifications,tool_calling,multi_turn}
      A2A_STREAMING_ENABLED: ${A2A_STREAMING_ENABLED:-true}
      A2A_STREAMING_BUFFER_SIZE: ${A2A_STREAMING_BUFFER_SIZE:-10}
      A2A_MAX_REQUEST_BYTES: ${A2A_MAX_REQUEST_BYTES:-40000000}
      CORE_AGENT_MEMORY: ${CORE_AGENT_MEMORY:-optional}
      MEMORY_STORAGE_TYPE: ${MEMORY_STORAGE_TYPE:-in-memory}
      MEMORY_SEARCH_LIMIT: ${MEMORY_SEARCH_LIMIT:-10}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      REMOTE_AGENTS: ${REMOTE_AGENTS:-}
      SEND_MESSAGE_API_KEY: ${SEND_MESSAGE_API_KEY:-}
      MCP_URL: ${MCP_URL:-}
      MCP_ALLOWED_SERVERS: ${MCP_ALLOWED_SERVERS:-}
      MCP_ALLOWED_TOOLS: ${MCP_ALLOWED_TOOLS:-}
      MCP_READ_ONLY_TOOLS: ${MCP_READ_ONLY_TOOLS:-}
      MCP_HEADERS_JSON: ${MCP_HEADERS_JSON:-}
      MCP_TIMEOUT: ${MCP_TIMEOUT:-30.0}
      MCP_SSE_READ_TIMEOUT: ${MCP_SSE_READ_TIMEOUT:-300.0}
      MCP_COLD_START_TIMEOUT_SECONDS: ${MCP_COLD_START_TIMEOUT_SECONDS:-300.0}
      USER_ID: ${USER_ID:-anonymous}
      PORT: 8000
      CORE_AGENT_MAX_DEPTH: ${CORE_AGENT_MAX_DEPTH:-2}
      CORE_AGENT_RUNTIME_MODE: ${CORE_AGENT_RUNTIME_MODE:-with_terminal}
      CORE_AGENT_ALLOWED_BUILTIN_TOOLS: ${CORE_AGENT_ALLOWED_BUILTIN_TOOLS:-}
      SKILLS_ROOT: ${SKILLS_ROOT:-/opt/core-agent/skills}
      CORE_AGENT_ALLOWED_SKILLS: ${CORE_AGENT_ALLOWED_SKILLS-systematic-debugging,verification-before-completion,knowledge-synthesis,explore-data,validate-data,statistical-analysis,sql-queries}
      CORE_AGENT_PYTHON_MAX_CODE_CHARS: ${CORE_AGENT_PYTHON_MAX_CODE_CHARS:-100000}
      CORE_AGENT_PYTHON_MAX_SECONDS: ${CORE_AGENT_PYTHON_MAX_SECONDS:-120}
      CORE_AGENT_PYTHON_MAX_OUTPUT_BYTES: ${CORE_AGENT_PYTHON_MAX_OUTPUT_BYTES:-1000000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORE_AGENT_LOG_CONTENT: ${CORE_AGENT_LOG_CONTENT:-true}
      CORE_AGENT_LOG_MAX_CHARS: ${CORE_AGENT_LOG_MAX_CHARS:-12000}
      LOCAL_WORKSPACE_ROOT: /tmp/core-agent/runs
      CHAT_WORKSPACE_ROOT: /data/chats
      SANDBOX_DNS_SERVERS: ${SANDBOX_DNS_SERVERS:-}
      SANDBOX_DENIED_CIDRS: ${SANDBOX_DENIED_CIDRS:-}
      SANDBOX_START_TIMEOUT_SECONDS: ${SANDBOX_START_TIMEOUT_SECONDS:-10}
      SANDBOX_MAX_CONCURRENT_PROCESSES: ${SANDBOX_MAX_CONCURRENT_PROCESSES:-4}
      SANDBOX_CPU_SECONDS: ${SANDBOX_CPU_SECONDS:-60}
      SANDBOX_ADDRESS_SPACE_BYTES: ${SANDBOX_ADDRESS_SPACE_BYTES:-2147483648}
      SANDBOX_MAX_OPEN_FILES: ${SANDBOX_MAX_OPEN_FILES:-256}
      SANDBOX_MAX_FILE_BYTES: ${SANDBOX_MAX_FILE_BYTES:-104857600}
      PYTHONDONTWRITEBYTECODE: "1"
      UV_CACHE_DIR: /tmp/uv-cache
      DURABLE_STORAGE_ROOT: /data/durable
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://phoenix:6006/v1/traces}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT:-true}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - agent-data:/data
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      phoenix:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  postgres-data:
  agent-data:
