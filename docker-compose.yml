services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    build: .
    command: ["core-agent-db", "migrate"]
    environment:
      DATABASE_MIGRATION_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      DATABASE_APP_ROLE: ${POSTGRES_USER}
      DATABASE_POOL_MIN: 0
      DATABASE_POOL_MAX: 1
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  agent:
    build: .
    environment:
      CORE_AGENT_ENVIRONMENT: development
      CORE_AGENT_STATE_BACKEND: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      DATABASE_AUTO_MIGRATE: "false"
      DATABASE_POOL_MIN: ${DATABASE_POOL_MIN:-1}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      MODEL_API_FORMAT: ${MODEL_API_FORMAT}
      MODEL_BASE_URL: ${MODEL_BASE_URL}
      MODEL_NAME: ${MODEL_NAME}
      MODEL_API_KEY: ${MODEL_API_KEY}
      CORE_AGENT_PORT: 8000
      LOCAL_WORKSPACE_ROOT: /tmp/core-agent/runs
      DURABLE_STORAGE_ROOT: /data/durable
    ports:
      - "${CORE_AGENT_PORT:-8000}:8000"
    volumes:
      - agent-data:/data
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  postgres-data:
  agent-data:
