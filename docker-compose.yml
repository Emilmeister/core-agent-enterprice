services:
  database:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:version-17.5.0@sha256:936d39fc27ea5b7807d39bdc184b1033222a413dc185858817cbf51d2bbf96e4
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      PHOENIX_SQL_DATABASE_SCHEMA: phoenix
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: ${PHOENIX_DEFAULT_RETENTION_POLICY_DAYS:-30}
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
      PHOENIX_TELEMETRY_ENABLED: "false"
    ports:
      - "${PHOENIX_PORT:-6006}:6006"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:6006/', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    build: .
    command: ["core-agent-db", "migrate"]
    environment:
      DATABASE_MIGRATION_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      DATABASE_APP_ROLE: ${POSTGRES_USER}
      DATABASE_POOL_MIN: 0
      DATABASE_POOL_MAX: 1
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  agent:
    build: .
    environment:
      CORE_AGENT_ENVIRONMENT: development
      AGENT_NAME: ${AGENT_NAME:-core-agent}
      AGENT_SYSTEM_PROMPT: ${AGENT_SYSTEM_PROMPT:-}
      SESSION_STORAGE_TYPE: postgres
      TASK_STORAGE_TYPE: ${TASK_STORAGE_TYPE:-postgres}
      SESSION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      DATABASE_AUTO_MIGRATE: "false"
      DATABASE_POOL_MIN: ${DATABASE_POOL_MIN:-1}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      LLM_API_FORMAT: ${LLM_API_FORMAT:-openai}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_BASE: ${LLM_API_BASE}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY}
      THINKING_LEVEL: ${THINKING_LEVEL:-}
      THINKING_ENABLED: ${THINKING_ENABLED:-true}
      AGENT_DESCRIPTION: ${AGENT_DESCRIPTION:-Policy-enforced core agent runtime}
      AGENT_VERSION: ${AGENT_VERSION:-1.0.0}
      A2A_CAPABILITIES: ${A2A_CAPABILITIES:-streaming,push_notifications,tool_calling,multi_turn}
      A2A_STREAMING_ENABLED: ${A2A_STREAMING_ENABLED:-true}
      A2A_STREAMING_BUFFER_SIZE: ${A2A_STREAMING_BUFFER_SIZE:-10}
      ARTIFACT_STORAGE_TYPE: ${ARTIFACT_STORAGE_TYPE:-in-memory}
      REMOTE_AGENTS: ${REMOTE_AGENTS:-}
      SEND_MESSAGE_API_KEY: ${SEND_MESSAGE_API_KEY:-}
      MCP_URL: ${MCP_URL:-}
      USER_ID: ${USER_ID:-anonymous}
      PORT: 8000
      CORE_AGENT_MAX_DEPTH: ${CORE_AGENT_MAX_DEPTH:-2}
      CORE_AGENT_RUNTIME_MODE: ${CORE_AGENT_RUNTIME_MODE:-with_terminal}
      CORE_AGENT_ALLOWED_BUILTIN_TOOLS: ${CORE_AGENT_ALLOWED_BUILTIN_TOOLS:-core.terminal.exec,core.python.exec,core.task.start,core.task.get,core.task.list,core.task.wait,core.task.cancel,core.delegate}
      CORE_AGENT_PYTHON_MAX_CODE_CHARS: ${CORE_AGENT_PYTHON_MAX_CODE_CHARS:-100000}
      CORE_AGENT_PYTHON_MAX_SECONDS: ${CORE_AGENT_PYTHON_MAX_SECONDS:-120}
      CORE_AGENT_PYTHON_MAX_OUTPUT_BYTES: ${CORE_AGENT_PYTHON_MAX_OUTPUT_BYTES:-1000000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORE_AGENT_LOG_CONTENT: ${CORE_AGENT_LOG_CONTENT:-true}
      CORE_AGENT_LOG_MAX_CHARS: ${CORE_AGENT_LOG_MAX_CHARS:-12000}
      LOCAL_WORKSPACE_ROOT: /tmp/core-agent/runs
      DURABLE_STORAGE_ROOT: /data/durable
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://phoenix:6006/v1/traces}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT:-true}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - agent-data:/data
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      phoenix:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  memory-volume-init:
    build: .
    user: "0:0"
    command: ["chown", "-R", "agent:agent", "/memory"]
    network_mode: none
    volumes:
      - memory-data:/memory
    restart: "no"

  memory:
    build: .
    command: ["core-agent-memory"]
    environment:
      MEMORY_ENVIRONMENT: development
      MEMORY_ROOT: /memory
      MEMORY_ALLOWED_NAMESPACE_PREFIXES: session/
      MEMORY_HOST: 0.0.0.0
      MEMORY_PORT: 8000
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://phoenix:6006/v1/traces}
    volumes:
      - memory-data:/memory
    depends_on:
      memory-volume-init:
        condition: service_completed_successfully
      phoenix:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  postgres-data:
  agent-data:
  memory-data:
