name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38
        env:
          POSTGRES_DB: core_agent
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d core_agent"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_MIGRATION_URL: postgresql://postgres:test@127.0.0.1:5432/core_agent
      TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/core_agent
      TEST_KEYCLOAK_URL: http://127.0.0.1:8080
      TEST_KEYCLOAK_ADMIN: enterprise-admin
      TEST_KEYCLOAK_ADMIN_PASSWORD: enterprise-test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.6"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run core-agent-db migrate
      - run: uv run ruff check core_agent tests
      - name: Start isolated Keycloak for authentication integration
        run: |
          docker run -d --name core-agent-keycloak-test -p 127.0.0.1:8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME="$TEST_KEYCLOAK_ADMIN" \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="$TEST_KEYCLOAK_ADMIN_PASSWORD" \
            quay.io/keycloak/keycloak:26.1.4@sha256:044a457e04987e1fff756be3d2fa325a4ef420fa356b7034ecc9f1b693c32761 start-dev
          curl --fail --silent --show-error --retry 30 --retry-delay 2 \
            --retry-connrefused --retry-max-time 90 --max-time 5 \
            "$TEST_KEYCLOAK_URL/realms/master/.well-known/openid-configuration" >/dev/null
      - run: uv run python -m unittest discover -s tests -v
      - name: Remove isolated Keycloak
        if: always()
        run: docker rm -f core-agent-keycloak-test
      - run: uv build --no-sources
      - run: docker build -t core-agent:ci .
      - run: test "$(docker image inspect core-agent:ci --format '{{.Config.User}}')" = agent
      - run: >-
          docker run --rm --entrypoint python core-agent:ci
          -c "import core_agent; print('image-smoke-ok')"
      - name: Check preinstalled skills
        run: |
          docker run --rm --entrypoint sh core-agent:ci -ec '
            cd "$SKILLS_ROOT"
            sha256sum --check SHA256SUMS
            test -z "$(find . -type l -print -quit)"
            test -z "$(find . -perm /222 -print -quit)"
            old_ifs=$IFS
            IFS=,
            for skill in $CORE_AGENT_ALLOWED_SKILLS
            do
              test -f "$skill/SKILL.md"
            done
            IFS=$old_ifs
          '
          docker run --rm --entrypoint python core-agent:ci -c '
          import os; from pathlib import Path; from core_agent.skills import SkillResolver;
          root = Path(os.environ["SKILLS_ROOT"]); names = os.environ["CORE_AGENT_ALLOWED_SKILLS"].split(",");
          resolver = SkillResolver([{"name": name, "source": (root / name).as_uri()} for name in names]);
          assert {skill.name for skill in resolver.discover()} == set(names);
          assert set(resolver.resolve_lock()) == set(names);
          print("preinstalled-skills-smoke-ok")'
      - name: Check preinstalled terminal CLI
        run: |
          docker run --rm --entrypoint sh core-agent:ci -ec '
            for command in \
              ls find gawk sed grep rg fd file tree xxd uchardet \
              jq yq xmlstarlet sqlite3 curl bsdtar zip unzip 7z \
              zstd xz bzip2 ip ss nc openssl \
              pdftotext pdfinfo pdftoppm pdfimages qpdf
            do
              command -v "$command" >/dev/null
            done
            yq --version | grep -F "mikefarah/yq" >/dev/null
            echo terminal-cli-smoke-ok
          '
      - name: Check preinstalled Python libraries
        run: >-
          docker run --rm --entrypoint /usr/local/bin/python3 core-agent:ci -P -c
          'import bs4, dateutil, defusedxml, docx, duckdb, ftfy, h2, httpx, httpx_sse;
          import jmespath, jsonschema, lxml, markdownify, numpy, openpyxl, pandas, PIL;
          import pptx, pydantic, pypdf, python_calamine, rapidfuzz, websockets, yaml;
          assert duckdb.sql("select 1").fetchone() == (1,);
          print("python-libraries-smoke-ok")'
      - run: >-
          POSTGRES_DB=core_agent POSTGRES_USER=core_agent POSTGRES_PASSWORD=test
          LLM_API_FORMAT=openai LLM_API_BASE=http://model.invalid/v1
          LLM_MODEL=test LLM_API_KEY=test docker compose config --quiet
