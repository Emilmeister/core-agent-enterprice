name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: core_agent
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d core_agent"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_MIGRATION_URL: postgresql://postgres:test@127.0.0.1:5432/core_agent
      TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/core_agent
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.6"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run core-agent-db migrate
      - run: uv run ruff check core_agent memory_service tests
      - run: uv run python -m unittest discover -s tests -v
      - run: uv build --no-sources
      - run: docker build -t core-agent:ci .
      - run: test "$(docker image inspect core-agent:ci --format '{{.Config.User}}')" = agent
      - run: docker run --rm --entrypoint sh core-agent:ci -c "test -w /memory"
      - run: >-
          docker run --rm --entrypoint python core-agent:ci
          -c "import core_agent, memory_service; print('image-smoke-ok')"
      - run: >-
          POSTGRES_DB=core_agent POSTGRES_USER=core_agent POSTGRES_PASSWORD=test
          LLM_API_FORMAT=openai LLM_API_BASE=http://model.invalid/v1
          LLM_MODEL=test LLM_API_KEY=test docker compose config --quiet
      - name: Smoke existing Memory volume
        env:
          COMPOSE_PROJECT_NAME: core-agent-ci
          POSTGRES_DB: core_agent
          POSTGRES_USER: core_agent
          POSTGRES_PASSWORD: test
          LLM_API_FORMAT: openai
          LLM_API_BASE: http://model.invalid/v1
          LLM_MODEL: test
          LLM_API_KEY: test
        run: |
          trap 'docker compose down -v' EXIT
          docker volume create core-agent-ci_memory-data
          docker run --rm --user 0:0 -v core-agent-ci_memory-data:/memory \
            --entrypoint sh core-agent:ci -c 'touch /memory/existing-data'
          docker compose up --build -d --wait --wait-timeout 60 memory
          docker compose exec -T memory sh -c \
            'test -w /memory && test -f /memory/existing-data'
