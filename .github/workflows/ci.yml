name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sandbox-linux:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      SANDBOX_CLUSTER: core-sandbox-${{ matrix.arch }}
      KUBECONFIG: ${{ runner.temp }}/core-sandbox/kubeconfig
      SANDBOX_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.6"
      - run: uv python install 3.12
      - name: Install pinned native kind
        run: |
          mkdir -p "$RUNNER_TEMP/core-sandbox/bin"
          curl --fail --silent --show-error --location --max-time 120 \
            "https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-$SANDBOX_ARCH" \
            --output "$RUNNER_TEMP/core-sandbox/bin/kind-linux-$SANDBOX_ARCH"
          cp deploy/kubernetes/kind.sha256 "$RUNNER_TEMP/core-sandbox/bin/"
          cd "$RUNNER_TEMP/core-sandbox/bin"
          sha256sum --check --ignore-missing kind.sha256
          chmod +x "kind-linux-$SANDBOX_ARCH"
          mv "kind-linux-$SANDBOX_ARCH" kind
          echo "$RUNNER_TEMP/core-sandbox/bin" >> "$GITHUB_PATH"
      - name: Build native application image
        run: docker build -t core-agent:sandbox .
      - name: Create disposable dual-stack Kubernetes cluster
        run: |
          kind create cluster --name "$SANDBOX_CLUSTER" --kubeconfig "$KUBECONFIG" \
            --config deploy/kubernetes/kind-sandbox.yaml --wait 120s \
            --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          docker cp "$SANDBOX_CLUSTER-control-plane:/usr/bin/kubectl" "$RUNNER_TEMP/core-sandbox/bin/kubectl"
          kind load docker-image core-agent:sandbox --name "$SANDBOX_CLUSTER"
          docker exec "$SANDBOX_CLUSTER-control-plane" mkdir -p /var/lib/kubelet/seccomp/core-agent
          docker cp "deploy/security/oci-$SANDBOX_ARCH.json" \
            "$SANDBOX_CLUSTER-control-plane:/var/lib/kubelet/seccomp/core-agent/oci.json"
      - name: Start controlled receivers inside the disposable node network
        run: |
          for address in 93.184.216.34/32 93.184.216.35/32 10.77.0.1/32 \
            2606:4700:abcd::10/128 2606:4700:abcd::11/128 fd77::1/128
          do
            docker exec "$SANDBOX_CLUSTER-control-plane" ip address add "$address" dev lo
          done
          docker run -d --name core-sandbox-network-fixture \
            --network "container:$SANDBOX_CLUSTER-control-plane" --user 0 \
            --cap-drop ALL --cap-add NET_BIND_SERVICE --read-only \
            --mount "type=bind,src=$GITHUB_WORKSPACE/deploy/kubernetes/network-fixture.py,dst=/fixture.py,readonly" \
            --entrypoint /usr/local/bin/python3 core-agent:sandbox -I -S /fixture.py 0.0.0.0
          docker exec core-sandbox-network-fixture curl --fail --silent --show-error \
            --retry 20 --retry-delay 1 --retry-connrefused --retry-max-time 30 \
            --max-time 3 http://127.0.0.1:18082/ready
          docker inspect "$SANDBOX_CLUSTER-control-plane" > "$RUNNER_TEMP/core-sandbox/node.json"
          uv run --no-project --python 3.12 deploy/kubernetes/network-fixture.py \
            --environment "$RUNNER_TEMP/core-sandbox/node.json" > "$RUNNER_TEMP/core-sandbox/fixture.env"
          kubectl --kubeconfig "$KUBECONFIG" create configmap core-agent-sandbox-fixture \
            --from-env-file="$RUNNER_TEMP/core-sandbox/fixture.env"
          kubectl --kubeconfig "$KUBECONFIG" create configmap core-agent-sandbox-tests \
            --from-file=tests/test_sandbox_linux.py
      - name: Verify mandatory sandbox acceptance in the Pod
        run: |
          kubectl --kubeconfig "$KUBECONFIG" apply -f deploy/kubernetes/sandbox-pod.yaml
          kubectl --kubeconfig "$KUBECONFIG" wait pod/core-agent-sandbox-tests \
            --for=condition=Ready --timeout=120s
          sandbox_pod_uid=$(kubectl --kubeconfig "$KUBECONFIG" get pod core-agent-sandbox-tests \
            -o jsonpath='{.metadata.uid}')
          sandbox_pod_cgroup_uid=${sandbox_pod_uid//-/_}
          sandbox_pod_pid_limit=$(docker exec "$SANDBOX_CLUSTER-control-plane" cat \
            "/sys/fs/cgroup/kubelet.slice/kubelet-kubepods.slice/kubelet-kubepods-burstable.slice/kubelet-kubepods-burstable-pod$sandbox_pod_cgroup_uid.slice/pids.max")
          test "$sandbox_pod_pid_limit" = 512
          kubectl --kubeconfig "$KUBECONFIG" wait pod/core-agent-sandbox-tests \
            --for=jsonpath='{.status.phase}'=Succeeded --timeout=800s
          kubectl --kubeconfig "$KUBECONFIG" logs core-agent-sandbox-tests
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: matrix.arch == 'amd64'
        with:
          node-version: "24"
      - name: Start isolated browser integration services
        if: matrix.arch == 'amd64'
        run: |
          command -v google-chrome
          uv sync --frozen
          docker run -d --name core-owner-browser-postgres --network kind \
            -p 127.0.0.1:49738:5432 -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=test \
            pgvector/pgvector:pg17@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38
          docker run -d --name core-owner-browser-keycloak --network kind \
            -p 127.0.0.1:49737:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=enterprise-admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=enterprise-test \
            quay.io/keycloak/keycloak:26.1.4@sha256:044a457e04987e1fff756be3d2fa325a4ef420fa356b7034ecc9f1b693c32761 start-dev
          curl --fail --silent --show-error --retry 30 --retry-delay 2 \
            --retry-connrefused --retry-max-time 90 --max-time 5 \
            http://127.0.0.1:49737/realms/master/.well-known/openid-configuration >/dev/null
          docker exec core-owner-browser-postgres pg_isready -U postgres
      - name: Verify actual owner browser file flow
        if: matrix.arch == 'amd64'
        env:
          CORE_AGENT_REQUIRE_BROWSER_TESTS: "1"
          OWNER_UI_BROWSER_IMAGE: core-agent:sandbox
          OWNER_UI_BROWSER_PG_ADMIN_URL: postgresql://postgres:test@127.0.0.1:49738/postgres
          TEST_KEYCLOAK_URL: http://127.0.0.1:49737
          TEST_KEYCLOAK_ADMIN: enterprise-admin
          TEST_KEYCLOAK_ADMIN_PASSWORD: enterprise-test
        run: |
          export OWNER_UI_BROWSER_CHROMIUM=$(command -v google-chrome)
          export BROWSER_KEYCLOAK_TARGET="$(docker inspect core-owner-browser-keycloak --format '{{.NetworkSettings.Networks.kind.IPAddress}}'):8080"
          export BROWSER_POSTGRES_TARGET="$(docker inspect core-owner-browser-postgres --format '{{.NetworkSettings.Networks.kind.IPAddress}}'):5432"
          uv run python -m unittest tests.test_owner_ui_files_browser -v
      - name: Collect diagnostics and remove only the disposable cluster
        if: always()
        run: |
          if command -v kubectl >/dev/null; then
            kubectl --kubeconfig "$KUBECONFIG" describe pod core-agent-sandbox-tests || true
            kubectl --kubeconfig "$KUBECONFIG" logs core-agent-sandbox-tests || true
          fi
          docker logs core-sandbox-network-fixture || true
          docker rm -f core-sandbox-network-fixture || true
          docker rm -f core-owner-browser-postgres core-owner-browser-keycloak || true
          if command -v kind >/dev/null; then
            kind delete cluster --name "$SANDBOX_CLUSTER" --kubeconfig "$KUBECONFIG"
          fi

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38
        env:
          POSTGRES_DB: core_agent
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d core_agent"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_MIGRATION_URL: postgresql://postgres:test@127.0.0.1:5432/core_agent
      TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/core_agent
      TEST_KEYCLOAK_URL: http://127.0.0.1:8080
      TEST_KEYCLOAK_ADMIN: enterprise-admin
      TEST_KEYCLOAK_ADMIN_PASSWORD: enterprise-test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.6"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run core-agent-db migrate
      - run: uv run ruff check core_agent tests
      - name: Start isolated Keycloak for authentication integration
        run: |
          docker run -d --name core-agent-keycloak-test -p 127.0.0.1:8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME="$TEST_KEYCLOAK_ADMIN" \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="$TEST_KEYCLOAK_ADMIN_PASSWORD" \
            quay.io/keycloak/keycloak:26.1.4@sha256:044a457e04987e1fff756be3d2fa325a4ef420fa356b7034ecc9f1b693c32761 start-dev
          curl --fail --silent --show-error --retry 30 --retry-delay 2 \
            --retry-connrefused --retry-max-time 90 --max-time 5 \
            "$TEST_KEYCLOAK_URL/realms/master/.well-known/openid-configuration" >/dev/null
      - run: uv run python -m unittest discover -s tests -v
      - name: Remove isolated Keycloak
        if: always()
        run: docker rm -f core-agent-keycloak-test
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build owner UI
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm run build
      - run: uv build --no-sources
      - run: docker build -t core-agent:ci .
      - run: test "$(docker image inspect core-agent:ci --format '{{.Config.User}}')" = agent
      - run: >-
          docker run --rm --entrypoint python core-agent:ci
          -c "import core_agent; print('image-smoke-ok')"
      - name: Check preinstalled skills
        run: |
          docker run --rm --entrypoint sh core-agent:ci -ec '
            cd "$SKILLS_ROOT"
            sha256sum --check SHA256SUMS
            test -z "$(find . -type l -print -quit)"
            test -z "$(find . -perm /222 -print -quit)"
            old_ifs=$IFS
            IFS=,
            for skill in $CORE_AGENT_ALLOWED_SKILLS
            do
              test -f "$skill/SKILL.md"
            done
            IFS=$old_ifs
          '
          docker run --rm --entrypoint python core-agent:ci -c '
          import os; from pathlib import Path; from core_agent.skills import SkillResolver;
          root = Path(os.environ["SKILLS_ROOT"]); names = os.environ["CORE_AGENT_ALLOWED_SKILLS"].split(",");
          resolver = SkillResolver([{"name": name, "source": (root / name).as_uri()} for name in names]);
          assert {skill.name for skill in resolver.discover()} == set(names);
          assert set(resolver.resolve_lock()) == set(names);
          print("preinstalled-skills-smoke-ok")'
      - name: Check preinstalled terminal CLI
        run: |
          docker run --rm --entrypoint sh core-agent:ci -ec '
            for command in \
              ls find gawk sed grep rg fd file tree xxd uchardet \
              jq yq xmlstarlet sqlite3 curl bsdtar zip unzip 7z \
              zstd xz bzip2 ip ss nc openssl \
              pdftotext pdfinfo pdftoppm pdfimages qpdf
            do
              command -v "$command" >/dev/null
            done
            yq --version | grep -F "mikefarah/yq" >/dev/null
            echo terminal-cli-smoke-ok
          '
      - name: Check preinstalled Python libraries
        run: >-
          docker run --rm --entrypoint /usr/local/bin/python3 core-agent:ci -P -c
          'import bs4, dateutil, defusedxml, docx, duckdb, ftfy, h2, httpx, httpx_sse;
          import jmespath, jsonschema, lxml, markdownify, numpy, openpyxl, pandas, PIL;
          import pptx, pydantic, pypdf, python_calamine, rapidfuzz, websockets, yaml;
          assert duckdb.sql("select 1").fetchone() == (1,);
          print("python-libraries-smoke-ok")'
      - run: >-
          POSTGRES_DB=core_agent POSTGRES_USER=core_agent POSTGRES_PASSWORD=test
          LLM_API_FORMAT=openai LLM_API_BASE=http://model.invalid/v1
          LLM_MODEL=test LLM_API_KEY=test docker compose config --quiet
