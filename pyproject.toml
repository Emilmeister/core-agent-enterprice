[project]
name = "core-agent"
version = "0.1.0"
description = "A2A agent runtime with built-in long-term memory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]==1.1.0",
    "croniter==6.2.4",
    "httpx>=0.28,<1",
    "mcp==1.28.1",
    "opentelemetry-exporter-otlp-proto-http==1.43.0",
    "opentelemetry-sdk==1.43.0",
    "psycopg[binary,pool]>=3.2,<4",
]

[project.scripts]
core-agent = "core_agent.app:main"
core-agent-db = "core_agent.database:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = ["core_agent"]
module-root = ""

[dependency-groups]
dev = [
    "pyyaml>=6.0,<7",
    "ruff==0.15.21",
]
python-tool = [
    "beautifulsoup4>=4.15.0,<5.0.0",
    "defusedxml>=0.7.1,<0.8.0",
    "duckdb>=1.5.5,<2.0.0",
    "ftfy>=6.3.1,<7.0.0",
    "httpx-sse>=0.4.3,<0.5.0",
    "httpx[http2]>=0.28.1,<0.29.0",
    "jmespath>=1.1.0,<2.0.0",
    "jsonschema>=4.26.0,<5.0.0",
    "lxml>=6.1.1,<7.0.0",
    "markdownify>=1.2.3,<2.0.0",
    "numpy>=2.5.1,<3.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "pandas>=3.0.5,<4.0.0",
    "pillow>=12.3.0,<13.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "pypdf>=6.14.2,<7.0.0",
    "python-calamine>=0.8.2,<0.9.0",
    "python-dateutil>=2.9.0.post0,<3.0.0",
    "python-docx>=1.2.0,<2.0.0",
    "python-pptx>=1.0.2,<2.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "rapidfuzz>=3.14.5,<4.0.0",
    "websockets>=17.0.1,<18.0.0",
]
